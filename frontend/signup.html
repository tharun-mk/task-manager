<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager - Sign Up</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2ff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .page { width: min(440px, 100%); background: #fff; border-radius: 18px; box-shadow: 0 20px 55px rgba(15, 23, 42, 0.12); padding: 34px; }
        h1 { margin-top: 0; color: #1e293b; }
        label { display: block; margin: 18px 0 8px; font-weight: 600; color: #475569; }
        input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 15px; }
        button { width: 100%; margin-top: 24px; padding: 14px 16px; border: none; border-radius: 12px; background: #4f46e5; color: #fff; font-size: 15px; cursor: pointer; }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        .message { margin-top: 20px; padding: 14px 16px; border-radius: 12px; display: none; }
        .message.success { background: #dcfce7; color: #166534; }
        .message.error { background: #fee2e2; color: #991b1b; }
        .footer { margin-top: 22px; text-align: center; color: #64748b; font-size: 14px; }
        .footer a { color: #4338ca; text-decoration: none; }
    </style>
</head>
<body>
    <section class="page">
        <h1>Create your account</h1>

        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Choose a username" autocomplete="username" />

        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Enter your email" autocomplete="email" />

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Create a password" autocomplete="new-password" />

        <button id="signupBtn">Send OTP</button>
        <div id="message" class="message"></div>

        <div class="footer">
            Already registered? <a href="login.html">Login</a>
        </div>
    </section>

    <script>
        const API_BASE_URL = 'https://task-manager-ur9j.onrender.com';
        const USERNAME_KEY = 'username';
        const signupBtn = document.getElementById('signupBtn');
        const messageBox = document.getElementById('message');

        if (localStorage.getItem(USERNAME_KEY)) {
            window.location.href = 'index.html';
        }

        function showMessage(text, type = 'success') {
            messageBox.textContent = text;
            messageBox.className = `message ${type}`;
            messageBox.style.display = 'block';
        }

        function hideMessage() {
            messageBox.style.display = 'none';
        }

        async function submitSignup() {
            hideMessage();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !email || !password) {
                return showMessage('Please complete all signup fields.', 'error');
            }

            signupBtn.disabled = true;
            try {
                const response = await fetch(`${API_BASE_URL}/signup/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password }),
                });

                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.detail || 'Unable to send OTP.');
                }

                sessionStorage.setItem('pendingSignup', JSON.stringify({ username, email }));
                showMessage('OTP sent. Redirecting to verification...', 'success');
                setTimeout(() => window.location.href = 'verify-otp.html', 1200);
            } catch (error) {
                showMessage(error.message || 'Signup failed.', 'error');
            } finally {
                signupBtn.disabled = false;
            }
        }

        signupBtn.addEventListener('click', submitSignup);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                submitSignup();
            }
        });
    </script>
</body>
</html>
