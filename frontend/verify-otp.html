<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager - Verify OTP</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8fafc; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .page { width: min(430px, 100%); background: #fff; border-radius: 18px; padding: 34px; box-shadow: 0 18px 40px rgba(15, 23, 42, 0.1); }
        h1 { margin-top: 0; color: #0f172a; }
        .subtitle { margin: 6px 0 24px; color: #475569; }
        label { display: block; margin: 16px 0 8px; font-weight: 600; color: #475569; }
        input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 15px; }
        button { width: 100%; margin-top: 24px; padding: 14px 16px; border: none; border-radius: 12px; background: #0ea5e9; color: #fff; font-size: 15px; cursor: pointer; }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        .message { margin-top: 20px; padding: 14px 16px; border-radius: 12px; display: none; }
        .message.success { background: #d1fae5; color: #166534; }
        .message.error { background: #fee2e2; color: #991b1b; }
        .footer { margin-top: 24px; text-align: center; color: #64748b; font-size: 14px; }
        .footer a { color: #0284c7; text-decoration: none; }
    </style>
</head>
<body>
    <section class="page">
        <h1>Verify OTP</h1>
        <p class="subtitle">Enter the code sent to your email to finish signup.</p>

        <label for="otp">One-time code</label>
        <input id="otp" type="number" placeholder="Enter OTP" />

        <button id="verifyBtn">Verify and Create Account</button>
        <div id="message" class="message"></div>

        <div class="footer">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </section>

    <script>
        const API_BASE_URL = 'https://task-manager-ur9j.onrender.com';
        const ACCESS_TOKEN_KEY = 'access_token';
        const verifyBtn = document.getElementById('verifyBtn');
        const messageBox = document.getElementById('message');

        if (localStorage.getItem(ACCESS_TOKEN_KEY)) {
            window.location.href = 'index.html';
        }

        function showMessage(text, type = 'success') {
            messageBox.textContent = text;
            messageBox.className = `message ${type}`;
            messageBox.style.display = 'block';
        }

        function hideMessage() {
            messageBox.style.display = 'none';
        }

        function getPendingSignup() {
            const raw = sessionStorage.getItem('pendingSignup');
            if (!raw) {
                return null;
            }
            try {
                return JSON.parse(raw);
            } catch (err) {
                return null;
            }
        }

        async function verifyOtp() {
            hideMessage();
            const pendingSignup = getPendingSignup();
            const otpValue = document.getElementById('otp').value.trim();

            if (!pendingSignup) {
                return showMessage('No pending signup found. Please start from the signup page.', 'error');
            }
            if (!otpValue) {
                return showMessage('Please enter the OTP sent to your email.', 'error');
            }

            verifyBtn.disabled = true;
            try {
                const response = await fetch(`${API_BASE_URL}/verify-otp/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: pendingSignup.email, otp: Number(otpValue) }),
                });

                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.detail || 'OTP verification failed.');
                }

                sessionStorage.removeItem('pendingSignup');
                localStorage.setItem(ACCESS_TOKEN_KEY, result.access_token);
                showMessage(`Account created successfully for ${result.username}. Redirecting...`, 'success');
                setTimeout(() => window.location.href = 'index.html', 1400);
            } catch (error) {
                showMessage(error.message || 'Unable to verify OTP.', 'error');
            } finally {
                verifyBtn.disabled = false;
            }
        }

        verifyBtn.addEventListener('click', verifyOtp);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                verifyOtp();
            }
        });
    </script>
</body>
</html>
