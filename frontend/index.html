<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; color: #333; }
        .container { max-width: 960px; margin: 0 auto; background: #fff; border-radius: 10px; box-shadow: 0 3px 18px rgba(0,0,0,0.08); padding: 28px; }
        h1, h2 { margin-top: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        label { display:block; margin-bottom:6px; font-weight:600; }
        input[type="text"], input[type="date"], input[type="number"], select { width:100%; padding:10px 12px; border:1px solid #ced4da; border-radius:8px; margin-bottom:14px; box-sizing:border-box; }
        button { background:#1976d2; color:white; border:none; border-radius:8px; padding:10px 16px; cursor:pointer; font-size:14px }
        button:disabled { background: #ced4da; cursor: not-allowed; }
        button.secondary { background:#6c757d } button.danger { background:#d9534f } button.small { padding:8px 12px }
        .task-card { padding:18px; border:1px solid #e9ecef; border-radius:10px; margin-bottom:14px; background:#fff }
        .task-card.completed { opacity:0.8; background-color: #f8f9fa; }
        .task-header { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap }
        .task-title { font-weight:700; margin:0 }
        .task-meta { color:#495057; margin:6px 0 0 }
        .task-actions { display:flex; gap:8px; flex-wrap:wrap }
        .message { display:none; padding:14px 16px; border-radius:8px; margin-bottom:20px }
        .message.success { background:#d4edda; color:#155724 }
        .message.error { background:#f8d7da; color:#721c24 }
        #taskList { padding:0; margin:0; list-style:none }
        .no-tasks { color:#6c757d; text-align:center; padding:20px 0 }
    </style>
</head>
<body>
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:16px;">
            <div>
                <h1>Task Manager</h1>
                <div id="welcomeText" style="color:#4b5563; font-size:14px; margin-top:-8px;"></div>
            </div>
            <button id="logoutButton" class="secondary" style="height:42px;">Logout</button>
        </div>
        <div id="message" class="message"></div>
        <div class="grid">
            <section>
                <h2>Create Task</h2>
                <label for="newTaskText">Task Description</label>
                <input type="text" id="newTaskText" placeholder="Enter task description">
                <label for="newTaskStatus">Status</label>
                <select id="newTaskStatus"><option value="pending">Pending</option><option value="completed">Completed</option></select>
                <label for="newTaskDate">Due Date</label>
                <input type="date" id="newTaskDate">
                <button id="createTaskBtn" onclick="createTask()">Create Task</button>
            </section>
            <section>
                <h2>Fetch Task by ID</h2>
                <label for="taskIdInput">Task ID</label>
                <input type="number" id="taskIdInput" placeholder="Enter task ID">
                <button onclick="getTaskById()">Get Task</button>
                <div id="singleTaskDetails" style="margin-top:18px"></div>
            </section>
        </div>
        <h2 style="margin-top:32px">All Tasks</h2>
        <ul id="taskList"></ul>
    </div>

    <script>
        /**
         * PRODUCTION CONFIGURATION
         * Configured to strictly use the live Render backend URL.
         */
        const API_BASE_URL = 'https://task-manager-ur9j.onrender.com';
        const USERNAME_KEY = 'username';
        const API_PATH = '/Tasks/';

        if (!localStorage.getItem(USERNAME_KEY)) {
            window.location.href = 'login.html';
        }

        function showMessage(text, type = 'success') {
            const message = document.getElementById('message');
            message.textContent = text; message.className = `message ${type}`; message.style.display = 'block';
            setTimeout(() => message.style.display = 'none', 5000);
        }

        async function fetchApi(path, options = {}) {
            const url = `${API_BASE_URL}${path}`;
            try {
                const response = await fetch(url, {
                    ...options,
                    headers: {
                        'Accept': 'application/json',
                        ...(options.headers || {})
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        localStorage.removeItem(ACCESS_TOKEN_KEY);
                        window.location.href = 'login.html';
                        return;
                    }
                    const txt = await response.text();
                    throw new Error(txt || `${response.status} ${response.statusText}`);
                }

                if (response.status === 204) return null;
                return await response.json();
            } catch (err) {
                console.error('API Error:', err.message);
                throw new Error(err.message || 'Network connectivity issue');
            }
        }

        async function fetchTasks() {
            try {
                const username = localStorage.getItem(USERNAME_KEY);
                const tasks = await fetchApi(`${API_PATH}?username=${encodeURIComponent(username)}`);
                renderTaskList(tasks);
            } catch (e) {
                showMessage(`Backend unreachable. Please verify connection.`, 'error');
            }
        }

        function logout() {
            localStorage.removeItem(USERNAME_KEY);
            window.location.href = 'login.html';
        }

        document.getElementById('logoutButton').addEventListener('click', logout);

        const username = localStorage.getItem(USERNAME_KEY);
        if (username) {
            document.getElementById('welcomeText').textContent = `Logged in as ${username}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function renderTaskList(tasks) {
            const list = document.getElementById('taskList'); list.innerHTML = '';
            if (!tasks || !tasks.length) { list.innerHTML = '<li class="no-tasks">No tasks found. Create one using the form above.</li>'; return; }
            
            tasks.forEach(task => {
                const li = document.createElement('li'); 
                li.className = 'task-card'; 
                if (task.status === 'completed') li.classList.add('completed');
                
                const safeTitle = escapeHtml(task.task_to_do);
                const safeStatus = escapeHtml(task.status);
                const safeDueDate = task.due_date ? escapeHtml(task.due_date) : 'None';

                const header = document.createElement('div'); 
                header.className = 'task-header';
                header.innerHTML = `<div><p class="task-title">#${task.id} - ${safeTitle}</p><p class="task-meta">Status: ${safeStatus} • Due date: ${safeDueDate}</p></div>`;
                
                const actions = document.createElement('div'); 
                actions.className = 'task-actions';
                
                const viewBtn = document.createElement('button'); 
                viewBtn.textContent = 'View'; 
                viewBtn.onclick = () => displaySingleTask(task);
                
                const editBtn = document.createElement('button'); 
                editBtn.className='secondary small'; 
                editBtn.textContent='Edit'; 
                editBtn.onclick=()=>startEditTask(li, task);
                
                const toggleBtn = document.createElement('button'); 
                toggleBtn.className='small'; 
                toggleBtn.textContent = task.status === 'pending' ? 'Mark Completed' : 'Mark Pending'; 
                toggleBtn.onclick = () => toggleTaskStatus(task);
                
                const delBtn = document.createElement('button'); 
                delBtn.className='danger small'; 
                delBtn.textContent='Delete'; 
                delBtn.onclick = () => deleteTask(task.id);
                
                actions.append(viewBtn, editBtn, toggleBtn, delBtn); 
                header.appendChild(actions); 
                li.appendChild(header); 
                list.appendChild(li);
            });
        }

        function displaySingleTask(task) {
            document.getElementById('singleTaskDetails').innerHTML = `
                <div style="padding:16px;background:#f1f3f5;border-radius:10px;">
                    <p><strong>ID:</strong> ${task.id}</p>
                    <p><strong>Task:</strong> ${escapeHtml(task.task_to_do)}</p>
                    <p><strong>Status:</strong> ${escapeHtml(task.status)}</p>
                    <p><strong>Due date:</strong> ${task.due_date ? escapeHtml(task.due_date) : 'None'}</p>
                </div>`;
        }

        async function getTaskById(){ 
            const id = document.getElementById('taskIdInput').value.trim(); 
            if(!id) return showMessage('Please enter a task ID.','error'); 
            try{ 
                const username = localStorage.getItem(USERNAME_KEY);
                const task = await fetchApi(`${API_PATH}${id}?username=${encodeURIComponent(username)}`); 
                displaySingleTask(task);
            }catch(e){ 
                showMessage(`Task not found or system error.`,'error'); 
            } 
        }

        async function createTask(){ 
            const text = document.getElementById('newTaskText').value.trim(); 
            const status = document.getElementById('newTaskStatus').value; 
            const dueDate = document.getElementById('newTaskDate').value || null; 
            const submitBtn = document.getElementById('createTaskBtn');

            if(!text) return showMessage('Task description cannot be empty.','error'); 
            
            try{ 
                submitBtn.disabled = true;
                const username = localStorage.getItem(USERNAME_KEY);
                await fetchApi(`${API_PATH}?username=${encodeURIComponent(username)}`, { 
                    method:'POST', 
                    headers:{'Content-Type':'application/json'}, 
                    body: JSON.stringify({ task_to_do: text, status, due_date: dueDate }) 
                }); 
                showMessage('Task created successfully.'); 
                document.getElementById('newTaskText').value=''; 
                document.getElementById('newTaskDate').value=''; 
                fetchTasks(); 
            }catch(e){ 
                showMessage(`Failed to save task.`,'error'); 
            } finally {
                submitBtn.disabled = false;
            }
        }

        function startEditTask(listItem, task){ 
            const existing = listItem.querySelector('.edit-form'); 
            if(existing){ existing.remove(); return;} 
            
            const form = document.createElement('div'); 
            form.className='edit-form'; 
            form.style.marginTop='14px'; 
            form.innerHTML = `
                <label>Task description</label>
                <input type="text" id="editText-${task.id}" value="${escapeHtml(task.task_to_do)}">
                <label>Status</label>
                <select id="editStatus-${task.id}">
                    <option value="pending" ${task.status==='pending'?'selected':''}>Pending</option>
                    <option value="completed" ${task.status==='completed'?'selected':''}>Completed</option>
                </select>
                <label>Due date</label>
                <input type="date" id="editDate-${task.id}" value="${task.due_date ?? ''}">
                <div style="display:flex;gap:10px;margin-top:10px">
                    <button id="save-${task.id}">Save</button>
                    <button id="cancel-${task.id}" class="secondary">Cancel</button>
                </div>`; 
            
            form.querySelector(`#cancel-${task.id}`).onclick = ()=> form.remove(); 
            form.querySelector(`#save-${task.id}`).onclick = (e) => {
                e.target.disabled = true;
                saveTaskChanges(task.id);
            }; 
            listItem.appendChild(form); 
        }

        async function saveTaskChanges(id){ 
            const text = document.getElementById(`editText-${id}`).value.trim(); 
            const status = document.getElementById(`editStatus-${id}`).value; 
            const dueDate = document.getElementById(`editDate-${id}`).value || null; 
            if(!text) return showMessage('Task description cannot be empty.','error'); 
            try{ 
                const username = localStorage.getItem(USERNAME_KEY);
                await fetchApi(`${API_PATH}${id}?username=${encodeURIComponent(username)}`, { 
                    method:'PUT', 
                    headers:{'Content-Type':'application/json'}, 
                    body: JSON.stringify({ task_to_do: text, status, due_date: dueDate }) 
                }); 
                showMessage('Task updated successfully.'); 
                fetchTasks(); 
            }catch(e){ 
                showMessage(`Update failed.`,'error'); 
            } 
        }

        async function deleteTask(id){ 
            if(!confirm('Are you sure you want to delete this task?')) return; 
            try{ 
                const username = localStorage.getItem(USERNAME_KEY);
                await fetchApi(`${API_PATH}${id}?username=${encodeURIComponent(username)}`, { method:'DELETE' }); 
                showMessage('Task deleted successfully.'); 
                fetchTasks(); 
            }catch(e){ 
                showMessage(`Delete operational failure.`,'error'); 
            } 
        }

        async function toggleTaskStatus(task){ 
            const newStatus = task.status === 'pending' ? 'completed' : 'pending'; 
            const dueDate = task.due_date === 'None' ? null : task.due_date || null; 
            try{ 
                const username = localStorage.getItem(USERNAME_KEY);
                await fetchApi(`${API_PATH}${task.id}?username=${encodeURIComponent(username)}`, { 
                    method:'PUT', 
                    headers:{'Content-Type':'application/json'}, 
                    body: JSON.stringify({ task_to_do: task.task_to_do, status: newStatus, due_date: dueDate }) 
                }); 
                showMessage('Task status updated.'); 
                fetchTasks(); 
            }catch(e){ 
                showMessage(`Status shift failed.`,'error'); 
            } 
        }

        // initial load
        fetchTasks();
    </script>
</body>
</html>
