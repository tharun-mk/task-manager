<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager - Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f4f8; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .page { width: min(420px, 100%); background: #fff; padding: 32px; border-radius: 16px; box-shadow: 0 18px 40px rgba(20, 40, 80, 0.12); }
        h1 { margin-top: 0; color: #1d3557; }
        label { display: block; margin: 16px 0 6px; color: #495057; font-weight: 600; }
        input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #ced4da; font-size: 15px; }
        button { width: 100%; margin-top: 20px; padding: 12px 14px; border: none; border-radius: 10px; color: #fff; background: #1d4ed8; font-size: 15px; cursor: pointer; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .message { margin-top: 20px; padding: 14px 16px; border-radius: 10px; display: none; }
        .message.success { background: #d1fae5; color: #065f46; }
        .message.error { background: #fee2e2; color: #991b1b; }
        .footer { margin-top: 24px; text-align: center; color: #6b7280; font-size: 14px; }
        .footer a { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <section class="page">
        <h1>Login</h1>
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" placeholder="Enter your username" />

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="Enter your password" />

        <button id="loginBtn">Sign in</button>
        <div id="message" class="message"></div>

        <div class="footer">
            Don't have an account? <a href="signup.html">Sign up</a>
        </div>
    </section>

    <script>
        const API_BASE_URL = 'https://task-manager-ur9j.onrender.com';
        const ACCESS_TOKEN_KEY = 'access_token';

        const messageBox = document.getElementById('message');
        const loginBtn = document.getElementById('loginBtn');

        if (localStorage.getItem(ACCESS_TOKEN_KEY)) {
            window.location.href = 'index.html';
        }

        function showMessage(text, type = 'success') {
            messageBox.textContent = text;
            messageBox.className = `message ${type}`;
            messageBox.style.display = 'block';
        }

        function hideMessage() {
            messageBox.style.display = 'none';
        }

        async function login() {
            hideMessage();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                return showMessage('Please fill both username and password.', 'error');
            }

            loginBtn.disabled = true;
            try {
                const response = await fetch(`${API_BASE_URL}/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => null);
                    const text = errorData?.detail || 'Login failed. Check your credentials.';
                    throw new Error(text);
                }

                const data = await response.json();
                localStorage.setItem(ACCESS_TOKEN_KEY, data.access_token);
                showMessage(`Welcome back, ${data.username}! Redirecting...`, 'success');
                setTimeout(() => window.location.href = 'index.html', 800);
            } catch (error) {
                showMessage(error.message || 'Unable to login at this time.', 'error');
            } finally {
                loginBtn.disabled = false;
            }
        }

        loginBtn.addEventListener('click', login);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
